name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build extension
        run: npm run build:ext

      # The privacy claim is the product's main differentiator, so it is asserted
      # here rather than trusted. If any network primitive ever reaches the bundle
      # the build fails, and the claim in the README stops being true loudly
      # instead of quietly.
      #
      # One pattern for every bundle, in scripts/check-network.mjs, shared with the
      # store packager — so the extension and the web build cannot drift into
      # checking for different things.
      - name: Assert the extension bundle makes no network calls
        run: node scripts/check-network.mjs extension/dist/content.js

      # The web bundle runs on someone else's site, next to code this repo does not
      # control. The claim it can make is narrower — this file never sends the
      # profile anywhere — and it is held to exactly the same check.
      - name: Build web bundle
        run: npm run build:web

      - name: Assert the web bundle makes no network calls
        run: npm run check:web
