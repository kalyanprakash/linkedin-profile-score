name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build extension
        run: npm run build:ext

      # The privacy claim is the product's main differentiator, so it is asserted
      # here rather than trusted. If any network primitive ever reaches the bundle
      # the build fails, and the claim in the README stops being true loudly
      # instead of quietly.
      - name: Assert the bundle makes no network calls
        run: |
          if grep -nE '\bfetch\(|XMLHttpRequest|WebSocket|sendBeacon|navigator\.connection' extension/dist/content.js; then
            echo "::error::Network primitive found in the extension bundle."
            echo "Profile data must never leave the browser. See README > Guarantees."
            exit 1
          fi
          echo "OK — no fetch, XMLHttpRequest, WebSocket or sendBeacon in the bundle."
